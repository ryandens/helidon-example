name: "Validate"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "Helidon Validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Must match the Temurin jmods build in helidon-jib-conventions.
          # Adoptium's API identifies jdk-27.0.1.0.2+1 as 27.0.1+0.
          java-version: '27.0.1+0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup TestLens
        uses: testlens-app/setup-testlens@v1
        with:
          use-oidc: true
          github-token: ''

      - name: Build and test application distributions
        run: ./gradlew build jibBuildTar

