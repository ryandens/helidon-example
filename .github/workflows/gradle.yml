name: "Validate"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "Helidon Validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # jlink must come from exactly the same build as the target jmods.
      - name: Install matching Temurin JDK
        shell: bash
        run: |
          version=$(sed -n 's/^val temurinVersion = "\([^"]*\)"$/\1/p' build-logic/src/main/kotlin/com.ryandens.example.helidon-jib-conventions.gradle.kts)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*\+[0-9]+$ ]]
          major=${version%%.*}
          major=${major%%+*}
          archive="OpenJDK${major}U-jdk_x64_linux_hotspot_${version/+/_}.tar.gz"
          release="https://github.com/adoptium/temurin${major}-binaries/releases/download/jdk-${version/+/%2B}"
          download_dir=$(mktemp -d)
          curl --fail --location --retry 3 "$release/$archive" -o "$download_dir/$archive"
          curl --fail --location --retry 3 "$release/$archive.sha256.txt" -o "$download_dir/$archive.sha256.txt"
          (cd "$download_dir" && sha256sum --check "$archive.sha256.txt")
          jdk_dir="$RUNNER_TEMP/temurin-$version"
          mkdir -p "$jdk_dir"
          tar -xzf "$download_dir/$archive" -C "$jdk_dir" --strip-components=1
          echo "JAVA_HOME=$jdk_dir" >> "$GITHUB_ENV"
          echo "$jdk_dir/bin" >> "$GITHUB_PATH"
          "$jdk_dir/bin/java" --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup TestLens
        uses: testlens-app/setup-testlens@v1
        with:
          use-oidc: true
          github-token: ''

      - name: Build and test application distributions
        run: ./gradlew build jibBuildTar

